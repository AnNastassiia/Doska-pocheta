{% extends 'base.html' %}
{% block content %}
<div class="auth-form">
    <div class="auth-form__header">
        <h2>Ссылка отправлена</h2>
        <p class="auth-form__subtitle">Проверьте вашу электронную почту. Мы отправили ссылку для сброса пароля.</p>
    </div>
    <div style="background: #d1fae5; border: 1px solid #6ee7b7; border-radius: 14px; padding: 16px; margin: 24px 0; color: #065f46;">
        <strong>Если вы не получили письмо, проверьте папку спама или попробуйте снова.</strong>
    </div>
    <p class="auth-form__footer"><a href="{% url 'login' %}">Вернуться ко входу</a></p>
</div>
{% endblock %}

{% extends 'base.html' %}
{% block content %}
<div class="auth-form">
    <div class="auth-form__header">
        <h2>Пароль сброшен</h2>
        <p class="auth-form__subtitle">Ваш пароль был успешно изменен.</p>
    </div>
    <div style="background: #d1fae5; border: 1px solid #6ee7b7; border-radius: 14px; padding: 16px; margin: 24px 0; color: #065f46;">
        <strong>Теперь вы можете войти со своим новым паролем.</strong>
    </div>
    <p class="auth-form__footer"><a href="{% url 'login' %}">Войти в аккаунт</a></p>
</div>
{% endblock %}

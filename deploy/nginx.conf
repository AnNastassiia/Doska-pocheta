server {
    listen 80;
    server_name your-traektoria.ru www.your-traektoria.ru;

    client_max_body_size 10M;

    location /static/ {
        alias /var/www/Doska-pocheta/staticfiles/;
    }

    location /media/ {
        alias /var/www/Doska-pocheta/media/;
    }

    location / {
        proxy_pass http://unix:/var/www/Doska-pocheta/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
